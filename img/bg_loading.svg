<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
	 width="1280" height="128" viewBox="0 0 1280 128">


<rect x="0" y="0" width="100%" height = "100%" fill="#ddd"/>
	<g>
		<circle cx="-10" cy="-10" r="4" stroke="none" fill="var(--primary)"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="3s"
				 dur='24s'
				 values="30,50; 630,20; 830,60; 980,10; 1330,70; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
	<g>
		<circle cx="-10" cy="-10" r="10" stroke="none" fill="var(--secondary)"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="0s"
				 dur='12s'
				 values="30,10; 330,40; 630,20; 1330,50; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
	
	<g>
		<circle cx="-10" cy="-10" r="6" stroke="none" fill="var(--primary)"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="0s"
				 dur='11s'
				 values="220,110; 400,140; 700,120; 950,150; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
	
	<g>
		<circle cx="-10" cy="-10" r="4" stroke="none" fill="var(--secondary)" opacity="0.8"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="0s"
				 dur='36s'
				 values="1280,100; 800,130; 300,80; -10,120; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
	
	<g>
		<circle cx="-10" cy="-10" r="3" stroke="none" fill="var(--primary)" opacity="0.9"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="0s"
				 dur='15s'
				 values="110,110; 320,140; 640,100; -50,260; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
	<g>
		<circle cx="-10" cy="-10" r="8" stroke="none" fill="var(--secondary)"/>
		<animateTransform 
				 attributeType="xml" 
				 attributeName="transform" 
				 type="translate"
				 begin="0s"
				 dur='18s'
				 values="530,10; 830,60; 930,40; 1330,50; "
				 repeatCount="indefinite"
				 />
				 
	</g>
	
</svg>
